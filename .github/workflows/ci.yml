name: CI
# Ivan 28.10: the free Actions minutes ran out — checks only on pull requests into main, only when code changed,
# an older run of the same PR is cancelled, no matrices; a manual run from the Actions tab when needed.
# Budget: 2000 minutes a month for the whole account.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "css/**"
      - "scripts/**"
      - "test/**"
      - "from-game3/**"
      - "index.html"
      - "docs/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/**"
  workflow_dispatch:
  # only for the cheap guard below (one short job per merge)
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/check-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # GitHub Free can't protect main on a private repo, so CI flags any commit
  # that landed on main without a pull request (a red ❌ on the commit + email). Same as kolo-core.
  main-only-via-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Commit must come from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$prs" = "0" ]; then
            echo "::error::Commit ${{ github.sha }} was pushed to main directly, not through a pull request."
            exit 1
          fi
          echo "OK: came from a merged pull request"
